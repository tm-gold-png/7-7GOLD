<!DOCTYPE html><html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>フロアマップ エディタ</title>
<style>
:root{--bg:#0f141b;--panel:#1d2530;--panel2:#232c39;--line:#2b3543;--text:#eef2f7;--muted:#93a0b3;--gold:#e8b84b}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;background:var(--bg);color:var(--text);-webkit-user-select:none;user-select:none}
#app{display:flex;flex-direction:column;height:100%}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;background:#161d27;border-bottom:1px solid var(--line);z-index:10}
.bar .grp{display:flex;gap:4px;align-items:center;padding-right:8px;margin-right:2px;border-right:1px solid var(--line)}
.bar .grp:last-child{border-right:none}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--text);height:34px;padding:0 11px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.btn:active{background:var(--panel2)}.btn.on{background:var(--gold);color:#10131a;border-color:var(--gold)}
.btn.gold{background:var(--gold);color:#10131a;border-color:var(--gold)}
.title{font-weight:800;color:var(--gold);font-size:15px;margin-right:6px}
select.btn{height:34px}
main{flex:1;position:relative;overflow:hidden;background:#fff}
#svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:default}
.mtile{stroke:#fff;stroke-width:.5}
.new-outline{stroke:#22c55e;stroke-width:1.9;pointer-events:none}
.tnum{font-size:4.3px;font-weight:700;font-family:Helvetica,Arial,sans-serif;pointer-events:none}
.zlab{font-weight:800;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:5px;opacity:.92;pointer-events:none}
.faclabel{text-anchor:middle;font-weight:800;pointer-events:none}
.sel-island{fill:none;stroke:#10b3ff;stroke-width:2;stroke-dasharray:4 3;pointer-events:none}
.sel-fac{fill:none;stroke:#10b3ff;stroke-width:2;pointer-events:none}
.handle{fill:#10b3ff;stroke:#fff;stroke-width:1.2;cursor:nwse-resize}
.grabsel{fill:none;stroke:#ff8c1a;stroke-width:2;pointer-events:none}
.pv{stroke:#fff;stroke-width:.5;pointer-events:none}
.hint{position:absolute;left:10px;bottom:10px;background:rgba(13,16,20,.82);border:1px solid var(--line);color:#cdd6e2;font-size:12px;padding:7px 11px;border-radius:8px;max-width:60%;line-height:1.5}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:1px;background:var(--line);border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.zoom button{width:38px;height:38px;border:none;background:var(--panel);color:var(--text);font-size:18px;cursor:pointer}.zoom button:active{background:var(--gold);color:#10131a}
#panel{position:absolute;right:10px;top:10px;width:210px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:none;z-index:9}
#panel.show{display:block}
#panel h4{margin:0 0 9px;font-size:13px;color:var(--gold)}
#panel label{display:block;font-size:11px;color:var(--muted);margin:8px 0 3px}
#panel input,#panel select{width:100%;height:32px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:0 8px;font-size:13px}
#panel .row2{display:flex;gap:8px}#panel .row2>div{flex:1}
#panel .del{margin-top:11px;width:100%;height:34px;background:#7a2230;border:1px solid #99303f;color:#fff;border-radius:8px;font-weight:700;cursor:pointer}
.toast{position:absolute;left:50%;top:54px;transform:translateX(-50%);background:#10131a;border:1px solid var(--line);color:#fff;font-size:13px;padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
</style></head><body>
<div id="app">
 <div class="bar">
  <span class="title">フロアマップ エディタ</span>
  <input class="btn" id="storeNameInput" type="text" placeholder="店舗名" style="width:170px;font-weight:800;color:var(--gold);background:var(--panel2)">
  <div class="grp">
   <button class="btn" id="mGrab5">5台ずつ</button>
   <button class="btn" id="mGrab10">10台ずつ</button>
   <button class="btn on" id="mIsland">島を動かす</button>
   <button class="btn" id="mMachine">1台ずつ</button>
   <button class="btn" id="mFac">設備を編集</button>
   <button class="btn" id="mNew" style="border-color:#22c55e">新台指定</button>
  </div>
  <div class="grp">
   <select class="btn" id="addType">
    <option value="entrance">出入口</option><option value="toilet_m">男性トイレ</option><option value="toilet_w">女性トイレ</option>
    <option value="settle">精算機</option><option value="change">両替機</option><option value="rest">休憩所</option>
    <option value="counter">カウンター</option><option value="elevator">エレベーター</option><option value="blank">空白（色自由）</option>
   </select>
   <button class="btn" id="addBtn">＋設備を追加</button>
  </div>
  <div class="grp">
   <button class="btn" id="undo">↶ 元に戻す</button>
   <button class="btn" id="fit">⊙ 全体</button>
   <button class="btn" id="rememberDefault">初期値記憶</button>
   <button class="btn" id="resetDefault">初期化</button>
  </div>
  <div class="grp">
   <button class="btn" id="load">読込</button>
   <input type="file" id="file" accept=".csv,.json,.txt" hidden>
   <button class="btn gold" id="expHtml">ビューア書出し(HTML)</button>
   <button class="btn" id="expJson">JSON</button>
   <button class="btn" id="expCsvM">台CSV</button>
   <button class="btn" id="expCsvF">設備CSV</button>
  </div>
 </div>
 <main>
  <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="hint" id="hint"></div>
  <div class="zoom"><button id="zin">＋</button><button id="zout">−</button></div>
  <div id="panel">
   <h4>設備の編集</h4>
   <label>種別</label>
   <select id="pType"><option value="entrance">出入口</option><option value="toilet_m">男性トイレ</option><option value="toilet_w">女性トイレ</option><option value="settle">精算機</option><option value="change">両替機</option><option value="rest">休憩所</option><option value="counter">カウンター</option><option value="elevator">エレベーター</option><option value="blank">空白（色自由）</option></select>
   <label>ラベル</label><input id="pLabel" type="text">
   <label>色（空白用）</label><input id="pColor" type="color" value="#88a0c0" style="width:100%;height:34px;border:none;background:none;padding:0;cursor:pointer">
   <div class="row2"><div><label>列</label><input id="pCol" type="number"></div><div><label>行</label><input id="pRow" type="number"></div></div>
   <div class="row2"><div><label>幅</label><input id="pW" type="number" min="1"></div><div><label>高さ</label><input id="pH" type="number" min="1"></div></div>
   <button class="del" id="pDel">この設備を削除</button>
  </div>
  <div class="toast" id="toast"></div>
 </main>
</div>

/* --- レート6種対応：CSVのレート表記のまま最大6色で自動色分け --- */
const RPAL=['#e5322c','#f7941d','#3f8fd6','#f2cf1a','#9b59b6','#1abc9c'];
function rLum(hex){if(!hex)return 0;var c=(''+hex).replace('#','');if(c.length<6)return 0;return 0.299*parseInt(c.substr(0,2),16)+0.587*parseInt(c.substr(2,2),16)+0.114*parseInt(c.substr(4,2),16);}
function rKind(k){var c=(''+k).charAt(0).toLowerCase();return c==='p'?'パチンコ':(c==='s'?'スロット':'');}
function rLabel(k){var m=(''+k).match(/(\d+(?:\.\d+)?)/);return m?m[1]+'円':(''+k);}
function resolveRates(db){var def=(db.rates||[]);var map={};def.forEach(function(r){map[r.key]=r;});var order=[];def.forEach(function(r){if(order.indexOf(r.key)<0)order.push(r.key);});(db.machines||[]).forEach(function(m){if(m.rate&&order.indexOf(m.rate)<0)order.push(m.rate);});return order.map(function(k,i){var d=map[k]||{};return{key:k,label:d.label||rLabel(k),kind:('kind' in d)?d.kind:rKind(k),color:d.color||RPAL[i%RPAL.length]};});}
function rTxt(rate){var col=(RMAP[rate]||{}).color||'#888';return rLum(col)>170?'#10131a':'#fff';}
/* --- 新台表記の解析（CSVの生の表記は保持し、表示のみ分離） --- */
function parseRateRaw(raw){var s=(''+(raw==null?'':raw)).trim();var isNew=false,base=s;
 if(/^新台/.test(s)){isNew=true;base=s.replace(/^新台/,'').trim();}
 else if(/新台$/.test(s)){isNew=true;base=s.replace(/新台$/,'').trim();}
 if(!base)base=s;
 if(/^[A-Za-z][A-Za-z0-9.]*$/.test(base))base=base.toLowerCase();
 return{key:base,isNew:isNew};}
function baseKeysDB(db){return{rates:db.rates,machines:(db.machines||[]).map(function(m){return{rate:parseRateRaw(m.rate).key};})};}

const NS='http://www.w3.org/2000/svg';
const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
function txtOn(hex){if(!hex)return "#10131a";const c=hex.replace("#","");if(c.length<6)return "#10131a";const r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);return (0.299*r+0.587*g+0.114*b)>150?"#10131a":"#fff";}
const svg=document.getElementById('svg');
let DB,RATES,RMAP,machines,facilities;
let scene,bgRect,facLayer,macLayer,selLayer,grabLayer,pvLayer;
let view={s:1,tx:0,ty:0},mode='island',sel=null,history=[];let grabSel=[],grabN=0,placeInfo=null;

function clone(o){return JSON.parse(JSON.stringify(o));}
function loadDB(db){
 DB=db; RATES=resolveRates(baseKeysDB(db)); RMAP=Object.fromEntries(RATES.map(r=>[r.key,r]));
 const sni=document.getElementById('storeNameInput');if(sni)sni.value=DB.store||'';
 machines=(db.machines||[]).map(m=>({no:+m.no,name:m.name||'',rate:m.rate,col:+m.col,row:+m.row}));
 facilities=(db.facilities||[]).map(f=>({type:f.type,label:f.label||'',col:+f.col,row:+f.row,w:+f.w||3,h:+f.h||3}));
 sel=null; history=[]; build(); fit();
}
function snap(){return{m:machines.map(x=>({no:x.no,name:x.name,rate:x.rate,col:x.col,row:x.row})),f:facilities.map(x=>({type:x.type,label:x.label,col:x.col,row:x.row,w:x.w,h:x.h}))};}
function pushHistory(){history.push(snap());if(history.length>40)history.shift();}
function build(){
 svg.innerHTML='';
 scene=el('g',{}); svg.appendChild(scene);
 let xs=machines.map(m=>m.col*CW), ys=machines.map(m=>m.row*CH);
 facilities.forEach(f=>{xs.push(f.col*CW);ys.push(f.row*CH);});
 const x0=Math.min(...xs)-CW*3,y0=Math.min(...ys)-CH*3,x1=Math.max(...xs)+CW*3,y1=Math.max(...ys)+CH*3;
 bgRect=el('rect',{x:x0,y:y0,width:x1-x0,height:y1-y0,fill:'#fff'}); scene.appendChild(bgRect);
 facLayer=el('g',{}); scene.appendChild(facLayer);
 macLayer=el('g',{}); scene.appendChild(macLayer);
 for(const m of machines){const pr=parseRateRaw(m.rate);const col=(RMAP[pr.key]||{}).color||'#888';
  const r=el('rect',{class:'mtile',x:m.col*CW-TW/2,y:m.row*CH-TH/2,width:TW,height:TH,rx:2,fill:col}); r.__m=m; m._t=r; macLayer.appendChild(r);
  const t=el('text',{class:'tnum',x:m.col*CW,y:m.row*CH+0.2,'text-anchor':'middle','dominant-baseline':'central',fill:rTxt(pr.key)}); t.textContent=m.no; m._x=t; macLayer.appendChild(t);
  if(pr.isNew)macLayer.appendChild(el('rect',{class:'new-outline',x:m.col*CW-TW/2-0.7,y:m.row*CH-TH/2-0.7,width:TW+1.4,height:TH+1.4,rx:2.6,fill:'none','pointer-events':'none'}));}
 // ゾーン文字は表示しない（マップ上の文字は消す）
 for(const f of facilities) drawFac(f);
 selLayer=el('g',{}); scene.appendChild(selLayer);
 grabLayer=el('g',{}); scene.appendChild(grabLayer); pvLayer=el('g',{}); scene.appendChild(pvLayer); drawGrab(); applyView(); refreshHint();
}
function drawFac(f){
 if(f._g)f._g.remove();
 const blank=(f.type==='blank'||f.type==='空白');
 const t=FAC[f.type]||{label:f.type,color:'#9aa',path:null,fg:'#fff'};
 const fillc=blank?(f.color||'#88a0c0'):t.color;
 const g=el('g',{transform:`translate(${f.col*CW},${f.row*CH})`}); f._g=g; g.__f=f;
 const w=f.w*CW,h=f.h*CH,fg=blank?txtOn(fillc):(t.fg||'#fff');
 g.appendChild(el('rect',{class:'fac',x:-w/2,y:-h/2,width:w,height:h,rx:5,fill:fillc,opacity:.94,stroke:'#fff','stroke-width':1.4,style:'cursor:move'}));
 const isz=Math.min(w,h)*0.5;
 if(!blank&&t.path)g.appendChild(el('path',{d:t.path,fill:fg,'pointer-events':'none',transform:`translate(${-isz/2},${-h/2+Math.max(4,h*0.1)}) scale(${isz/24})`}));
 const tl=el('text',{class:'faclabel',x:0,y:h/2-Math.max(5,h*0.12),'font-size':Math.min(w*0.32,h*0.26,13),fill:fg});tl.textContent=f.label||(blank?'':t.label);g.appendChild(tl);
 facLayer.appendChild(g);
}
function applyView(){scene.setAttribute('transform',`translate(${view.tx},${view.ty}) scale(${view.s})`);drawSel();}
function fit(){const b=bgRect;const x0=+b.getAttribute('x'),y0=+b.getAttribute('y'),W=+b.getAttribute('width'),H=+b.getAttribute('height');const vw=svg.clientWidth,vh=svg.clientHeight,s=Math.min(vw/W,vh/H)*0.96;view.s=s;view.tx=(vw-W*s)/2-x0*s;view.ty=(vh-H*s)/2-y0*s;applyView();}
function toWorld(cx,cy){const r=svg.getBoundingClientRect();return{x:(cx-r.left-view.tx)/view.s,y:(cy-r.top-view.ty)/view.s};}

// ---- 選択描画 ----
function drawSel(){if(!selLayer)return;selLayer.innerHTML='';if(!sel)return;
 if(sel.kind==='island'){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;sel.list.forEach(m=>{x0=Math.min(x0,m.col*CW-TW/2);y0=Math.min(y0,m.row*CH-TH/2);x1=Math.max(x1,m.col*CW+TW/2);y1=Math.max(y1,m.row*CH+TH/2);});
  selLayer.appendChild(el('rect',{class:'sel-island',x:x0-2,y:y0-2,width:x1-x0+4,height:y1-y0+4,rx:4}));}
 else if(sel.kind==='fac'){const f=sel.f,w=f.w*CW,h=f.h*CH,x=f.col*CW,y=f.row*CH;
  selLayer.appendChild(el('rect',{class:'sel-fac',x:x-w/2-2,y:y-h/2-2,width:w+4,height:h+4,rx:6}));
  const hd=el('rect',{class:'handle',x:x+w/2-4,y:y+h/2-4,width:8,height:8,rx:1.5});hd.__handle=true;selLayer.appendChild(hd);}
}

// ---- 島グループ ----
function islandOf(m){const same=machines.filter(x=>x.col===m.col&&x.rate===m.rate).sort((a,b)=>a.row-b.row);
 let run=[m];const idx=same.findIndex(x=>x===m);
 for(let i=idx-1;i>=0;i--){if(same[i].row===same[i+1].row-1)run.unshift(same[i]);else break;}
 for(let i=idx+1;i<same.length;i++){if(same[i].row===same[i-1].row+1)run.push(same[i]);else break;}
 return run;}

// ---- ポインタ操作（capture非依存・window監視で取りこぼし防止）----
let drag=null;
function onDown(e){const w=toWorld(e.clientX,e.clientY);const tg=e.target;
 if(tg.__handle){pushHistory();drag={type:'resize',f:sel.f,sx:w.x,sy:w.y,w0:sel.f.w,h0:sel.f.h};e.preventDefault&&e.preventDefault();return;}
 if(mode==='grab5'||mode==='grab10'){
  if(tg.classList&&tg.classList.contains('mtile')){const m=tg.__m;const i=grabSel.indexOf(m);if(i>=0)grabSel.splice(i,1);else if(grabSel.length<grabN)grabSel.push(m);else toast(grabN+'台選択済み。空いた所へドラッグで配置');drawGrab();updateGrabHint();e.preventDefault&&e.preventDefault();return;}
  if(grabSel.length===grabN&&grabN>0){pushHistory();drag={type:'place'};updatePlace(w.x,w.y);e.preventDefault&&e.preventDefault();return;}
  sel=null;drawSel();drag={type:'pan',sx:e.clientX,sy:e.clientY,tx:view.tx,ty:view.ty};return;}
 if(mode==='newmark'&&tg.classList&&tg.classList.contains('mtile')){const m=tg.__m;pushHistory();toggleNewMark(m);build();saveLocal();const pr=parseRateRaw(m.rate);toast(m.no+'台を'+(pr.isNew?'新台に指定しました':'新台解除しました'));e.preventDefault&&e.preventDefault();return;}
 if((mode==='island'||mode==='machine')&&tg.classList&&tg.classList.contains('mtile')){const m=tg.__m;pushHistory();
  if(mode==='machine'){sel={kind:'island',list:[m]};drawSel();drag={type:'island',list:[m],sx:w.x,sy:w.y,start:[{m,c:m.col,r:m.row}]};}
  else{const list=islandOf(m);sel={kind:'island',list};drawSel();drag={type:'island',list,sx:w.x,sy:w.y,start:list.map(x=>({m:x,c:x.col,r:x.row}))};}
  e.preventDefault&&e.preventDefault();return;}
 if(mode==='fac'){let g=tg.closest&&tg.closest('g');if(g&&g.__f){const f=g.__f;selectFac(f);pushHistory();drag={type:'fac',f,sx:w.x,sy:w.y,c0:f.col,r0:f.row};e.preventDefault&&e.preventDefault();return;}}
 sel=null;drawSel();panelHide();drag={type:'pan',sx:e.clientX,sy:e.clientY,tx:view.tx,ty:view.ty};
}
function onMove(e){if(!drag)return;
 if(drag.type==='place'){const w=toWorld(e.clientX,e.clientY);updatePlace(w.x,w.y);return;}
 if(drag.type==='pan'){view.tx=drag.tx+(e.clientX-drag.sx);view.ty=drag.ty+(e.clientY-drag.sy);applyView();return;}
 const w=toWorld(e.clientX,e.clientY);
 if(drag.type==='island'){const dc=Math.round((w.x-drag.sx)/CW),dr=Math.round((w.y-drag.sy)/CH);
  drag.start.forEach(z=>{z.m.col=z.c+dc;z.m.row=z.r+dr;const t=z.m._t,x=z.m._x;if(t){t.setAttribute('x',z.m.col*CW-TW/2);t.setAttribute('y',z.m.row*CH-TH/2);}if(x){x.setAttribute('x',z.m.col*CW);x.setAttribute('y',z.m.row*CH+0.2);}});drawSel();return;}
 if(drag.type==='fac'){drag.f.col=drag.c0+Math.round((w.x-drag.sx)/CW);drag.f.row=drag.r0+Math.round((w.y-drag.sy)/CH);drag.f._g.setAttribute('transform',`translate(${drag.f.col*CW},${drag.f.row*CH})`);drawSel();syncPanel();return;}
 if(drag.type==='resize'){drag.f.w=Math.max(1,drag.w0+Math.round((w.x-drag.sx)/CW));drag.f.h=Math.max(1,drag.h0+Math.round((w.y-drag.sy)/CH));drawFac(drag.f);drawSel();syncPanel();}
}
function onUp(){if(drag&&drag.type==='place'){commitPlace();drag=null;return;}if(drag&&drag.type!=='pan')saveLocal();drag=null;}
svg.addEventListener('pointerdown',onDown);
window.addEventListener('pointermove',onMove,{passive:false});
window.addEventListener('pointerup',onUp);
window.addEventListener('pointercancel',onUp);
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;const f=e.deltaY<0?1.12:0.89;const ns=Math.max(0.15,Math.min(10,view.s*f)),k=ns/view.s;view.tx=px-(px-view.tx)*k;view.ty=py-(py-view.ty)*k;view.s=ns;applyView();},{passive:false});
document.getElementById('zin').onclick=()=>{const ns=Math.min(10,view.s*1.25),k=ns/view.s,px=svg.clientWidth/2,py=svg.clientHeight/2;view.tx=px-(px-view.tx)*k;view.ty=py-(py-view.ty)*k;view.s=ns;applyView();};
document.getElementById('zout').onclick=()=>{const ns=Math.max(0.15,view.s*0.8),k=ns/view.s,px=svg.clientWidth/2,py=svg.clientHeight/2;view.tx=px-(px-view.tx)*k;view.ty=py-(py-view.ty)*k;view.s=ns;applyView();};
document.getElementById('fit').onclick=fit;

// ---- モード ----
function refreshHint(){
 if(mode==='grab5'||mode==='grab10'){updateGrabHint();return;}
 const H={island:'島モード：台をドラッグでその島ごと移動／空白ドラッグで全体移動・ホイールで拡大',machine:'1台モード：台をドラッグで1台だけ移動／空白ドラッグで全体移動',fac:'設備モード：アイコンをドラッグで移動／角ハンドルで拡大縮小／右パネルで種別・大きさ・削除',newmark:'新台指定モード：台をタップすると新台（緑枚）にトグル。もう一度タップで解除'};
 document.getElementById('hint').textContent=H[mode]||'';}
function setMode(mm){clearGrab();mode=mm;sel=null;drawSel();panelHide();
 grabN=mm==='grab5'?5:(mm==='grab10'?10:0);
 ['mGrab5','mGrab10','mIsland','mMachine','mFac','mNew'].forEach(id=>document.getElementById(id).classList.remove('on'));
 const map={grab5:'mGrab5',grab10:'mGrab10',island:'mIsland',machine:'mMachine',fac:'mFac',newmark:'mNew'};
 if(map[mm])document.getElementById(map[mm]).classList.add('on');
 refreshHint();}
function toggleNewMark(m){const pr=parseRateRaw(m.rate);m.rate=pr.isNew?pr.key:('新台'+pr.key);}
// ---- 5台/10台 まとめ配置 ----
function clearGrab(){grabSel=[];placeInfo=null;if(grabLayer)grabLayer.innerHTML='';if(pvLayer)pvLayer.innerHTML='';}
function drawGrab(){if(!grabLayer)return;grabLayer.innerHTML='';grabSel.forEach((m,i)=>{grabLayer.appendChild(el('rect',{class:'grabsel',x:m.col*CW-TW/2-1.5,y:m.row*CH-TH/2-1.5,width:TW+3,height:TH+3,rx:3}));const t=el('text',{x:m.col*CW,y:m.row*CH-TH/2-2,'text-anchor':'middle','font-size':5,'font-weight':800,fill:'#ff8c1a'});t.textContent=(i+1);grabLayer.appendChild(t);});}
function updateGrabHint(){if(mode!=='grab5'&&mode!=='grab10')return;var n=grabSel.length;var t=(n<grabN)?(grabN+'台ずつ：台をタップで選択（'+n+'/'+grabN+'）'):(grabN+'台ずつ：選択完了（'+grabN+'/'+grabN+'）→空いた所へドラッグ（左上が基準）で横1列に配置');document.getElementById('hint').textContent=t;}
function updatePlace(wx,wy){var c0=Math.round((wx+TW/2)/CW),r0=Math.round((wy+TH/2)/CH);var occ=new Set(machines.filter(function(m){return grabSel.indexOf(m)<0;}).map(function(m){return m.col+','+m.row;}));var ok=true,cells=[];for(var i=0;i<grabN;i++){var c=c0+i,r=r0;cells.push([c,r]);if(occ.has(c+','+r))ok=false;}placeInfo={c0:c0,r0:r0,ok:ok,cells:cells};drawPlace();}
function drawPlace(){if(!pvLayer)return;pvLayer.innerHTML='';if(!placeInfo)return;placeInfo.cells.forEach(function(cell){pvLayer.appendChild(el('rect',{class:'pv',x:cell[0]*CW-TW/2,y:cell[1]*CH-TH/2,width:TW,height:TH,rx:2,fill:placeInfo.ok?'#10b3ff':'#e5322c',opacity:0.6}));});var bx=placeInfo.c0*CW-TW/2-2,by=placeInfo.r0*CH-TH/2-2,bw=(grabN-1)*CW+TW+4,bh=TH+4;pvLayer.appendChild(el('rect',{x:bx,y:by,width:bw,height:bh,rx:3,fill:'none',stroke:placeInfo.ok?'#0a7a3a':'#c0392b','stroke-width':1.6,'stroke-dasharray':'4 3'}));}
function commitPlace(){if(!placeInfo)return;if(!placeInfo.ok){if(pvLayer)pvLayer.innerHTML='';placeInfo=null;if(history.length)history.pop();toast('そこは台があるため配置できません');return;}placeInfo.cells.forEach(function(cell,i){var m=grabSel[i];m.col=cell[0];m.row=cell[1];});var n=grabN;grabSel=[];placeInfo=null;build();saveLocal();updateGrabHint();toast(n+'台を横1列に配置しました');}
document.getElementById('mGrab5').onclick=()=>setMode('grab5');
document.getElementById('mGrab10').onclick=()=>setMode('grab10');

document.getElementById('mMachine').onclick=()=>setMode('machine');

// ---- 設備 追加・選択・パネル ----
function selectFac(f){setModeIfNeeded();sel={kind:'fac',f};drawSel();panelShow(f);}
function setModeIfNeeded(){if(mode!=='fac')setMode('fac');}
document.getElementById('addBtn').onclick=()=>{pushHistory();const ty=document.getElementById('addType').value;
 // 画面中央の列・行に置く
 const c=Math.round((svg.clientWidth/2-view.tx)/view.s/CW),r=Math.round((svg.clientHeight/2-view.ty)/view.s/CH);
 const f={type:ty,label:(ty==='blank'?'':((FAC[ty]||{}).label||ty)),col:c,row:r,w:3,h:3};if(ty==='blank')f.color='#88a0c0';facilities.push(f);drawFac(f);setMode('fac');selectFac(f);saveLocal();toast(ty==='blank'?'空白を追加しました（色はパネルで選択）':'設備を追加しました（ドラッグで移動）');};
const panel=document.getElementById('panel');
function panelShow(f){panel.classList.add('show');document.getElementById('pType').value=f.type;document.getElementById('pLabel').value=f.label;document.getElementById('pColor').value=f.color||'#88a0c0';syncPanel();}
function panelHide(){panel.classList.remove('show');}
function syncPanel(){if(!sel||sel.kind!=='fac')return;const f=sel.f;document.getElementById('pCol').value=f.col;document.getElementById('pRow').value=f.row;document.getElementById('pW').value=f.w;document.getElementById('pH').value=f.h;}
function panelApply(){if(!sel||sel.kind!=='fac')return;const f=sel.f;f.type=document.getElementById('pType').value;f.label=document.getElementById('pLabel').value;f.col=+document.getElementById('pCol').value;f.row=+document.getElementById('pRow').value;f.w=Math.max(1,+document.getElementById('pW').value);f.h=Math.max(1,+document.getElementById('pH').value);f.color=document.getElementById('pColor').value;drawFac(f);drawSel();}
['pType','pLabel','pColor','pCol','pRow','pW','pH'].forEach(id=>{const e=document.getElementById(id);e.addEventListener('focus',()=>pushHistory());e.addEventListener('input',()=>{panelApply();saveLocal();});});
document.getElementById('pDel').onclick=()=>{if(!sel||sel.kind!=='fac')return;pushHistory();const f=sel.f;f._g.remove();facilities=facilities.filter(x=>x!==f);sel=null;drawSel();panelHide();saveLocal();toast('削除しました');};

// ---- 元に戻す ----
document.getElementById('undo').onclick=()=>{if(!history.length){toast('これ以上戻せません');return;}const h=history.pop();machines=h.m.map(m=>({...m}));facilities=h.f.map(f=>({...f}));sel=null;build();saveLocal();toast('元に戻しました');};

// ---- 読込 ----
document.getElementById('load').onclick=()=>document.getElementById('file').click();
document.getElementById('file').addEventListener('change',ev=>{const file=ev.target.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{try{applyLoad(file.name,rd.result);}catch(e){toast('読込エラー:'+e.message);}ev.target.value='';};rd.readAsText(file,'utf-8');});
function splitCsv(line){const o=[];let c='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(q){if(ch==='"'){if(line[i+1]==='"'){c+='"';i++;}else q=false;}else c+=ch;}else{if(ch===','){o.push(c);c='';}else if(ch==='"')q=true;else c+=ch;}}o.push(c);return o;}
function applyLoad(fn,text){if(/\.json$/i.test(fn)||text.trim()[0]==='{'){const db=JSON.parse(text);if(!db.machines)throw new Error('machines が無い');loadDB(db);saveLocal();toast('JSON読込: '+(db.store||fn));return;}
 text=text.replace(/^\uFEFF/,'');const lines=text.split(/\r?\n/).filter(l=>l.trim());const head=splitCsv(lines[0]).map(h=>h.replace(/\s/g,''));const has=n=>head.indexOf(n);
 if(has('種別')>=0||has('type')>=0){const it=Math.max(has('種別'),has('type')),il=Math.max(has('ラベル'),has('label')),ic=Math.max(has('列'),has('col')),ir=Math.max(has('行'),has('row')),iw=Math.max(has('幅'),has('w')),ih=Math.max(has('高さ'),has('h'));
  facilities=[];let importedStore=null;const ferrs=[];
  for(let i=1;i<lines.length;i++){const c=splitCsv(lines[i]);if(!c[it])continue;const ty=c[it].trim();
   if(/^(店舗|店舗名|store)$/i.test(ty)){importedStore=(c[il]||'').trim();continue;}
   const fc=+c[ic],fr=+c[ir];
   if(!isFinite(fc)||!isFinite(fr)){ferrs.push((i+1)+'行目: 「'+ty+'」の列/行が数値ではありません');continue;}
   facilities.push({type:ty,label:(c[il]||'').trim(),col:fc,row:fr,w:+c[iw]||3,h:+c[ih]||3});}
  DB.facilities=facilities;
  if(importedStore){DB.store=importedStore;const sni=document.getElementById('storeNameInput');if(sni)sni.value=importedStore;}
  build();fit();saveLocal();toast('設備CSV読込: '+facilities.length+'件'+(importedStore?'、店舗名：'+importedStore:'')+(ferrs.length?('／'+ferrs.length+'行スキップ'):''));
  if(ferrs.length)alert('以下の行をスキップしました:\n\n'+ferrs.join('\n'));return;}
 const iNo=has('台番')>=0?has('台番'):0,iR=has('レート')>=0?has('レート'):1,iNm=has('機種名')>=0?has('機種名'):2,iC=has('列')>=0?has('列'):3,iRw=has('行')>=0?has('行'):4;
 const ms=[],errs=[],seen=new Set();
 for(let i=1;i<lines.length;i++){const c=splitCsv(lines[i]);if(!c[iNo]||!String(c[iNo]).trim())continue;
  const no=+c[iNo],col=+c[iC],row=+c[iRw];
  if(!isFinite(no)){errs.push((i+1)+'行目: 台番「'+c[iNo]+'」が数値ではありません');continue;}
  if(seen.has(no)){errs.push((i+1)+'行目: 台番'+no+'が重複しています');continue;}
  if(!isFinite(col)||!isFinite(row)){errs.push((i+1)+'行目: 台番'+no+'の列/行が数値ではありません');continue;}
  seen.add(no);ms.push({no:no,rate:(c[iR]||'').trim(),name:(c[iNm]||'').trim(),col:col,row:row});}
 if(!ms.length)throw new Error('有効な台データが1件もありません（列の並びを確認してください）');
 DB.machines=ms;machines=ms.map(m=>({...m}));RATES=resolveRates(baseKeysDB(DB));RMAP=Object.fromEntries(RATES.map(r=>[r.key,r]));build();fit();saveLocal();
 toast('台CSV読込: '+ms.length+'台（レート'+RATES.length+'種）'+(errs.length?('／'+errs.length+'行スキップ'):''));
 if(errs.length)alert('以下の行をスキップしました:\n\n'+errs.slice(0,20).join('\n')+(errs.length>20?'\n…他'+(errs.length-20)+'件':''));}

// ---- 書き出し ----
function dl(name,text,type){const b=new Blob([text],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);}
function currentDB(){return{store:DB.store||'店舗名',rates:RATES,machines:machines.map(m=>({no:m.no,rate:m.rate,name:m.name,col:m.col,row:m.row})),facilities:facilities.map(f=>({type:f.type,label:f.label,col:f.col,row:f.row,w:f.w,h:f.h,color:f.color}))};}
document.getElementById('storeNameInput').addEventListener('input',()=>{DB.store=document.getElementById('storeNameInput').value.trim();saveLocal();});
document.getElementById('expJson').onclick=()=>{dl((DB.store||'layout')+'.json',JSON.stringify(currentDB(),null,1),'application/json');toast('JSONを保存しました');};
document.getElementById('expCsvM').onclick=()=>{const r=[['台番','レート','機種名','列','行']];machines.forEach(m=>r.push([m.no,m.rate,m.name,m.col,m.row]));dl('layout.csv','\uFEFF'+r.map(x=>x.join(',')).join('\r\n'),'text/csv');toast('台CSVを保存しました');};
document.getElementById('expCsvF').onclick=()=>{const r=[['種別','ラベル','列','行','幅','高さ'],['店舗名',DB.store||'','','','','']];facilities.forEach(f=>r.push([f.type,f.label,f.col,f.row,f.w,f.h]));dl('facilities.csv','\uFEFF'+r.map(x=>x.join(',')).join('\r\n'),'text/csv');toast('設備CSVを保存しました');};
document.getElementById('expHtml').onclick=()=>{const bytes=Uint8Array.from(atob(VIEWER_B64),c=>c.charCodeAt(0));const tpl=new TextDecoder('utf-8').decode(bytes);
 const json=JSON.stringify(currentDB()).replace(/</g,'\\u003c');
 const out=tpl.replace('__DB__',()=>json);
 dl('index.html',out,'text/html');toast('index.htmlを書き出しました（そのままGitHubへ）');};

// ---- toast ----
let tmr;function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(tmr);tmr=setTimeout(()=>e.classList.remove('show'),1800);}

// ---- 自動保存（このブラウザに配置を記憶）＆ 復元 ----
function lsKey(){return 'fm:'+(((DB&&DB.store)||(DEFAULT_DB&&DEFAULT_DB.store)||'store'));}
function saveLocal(){try{localStorage.setItem(lsKey(),JSON.stringify(currentDB()));localStorage.setItem('fm:last',(DB&&DB.store)||'');}catch(e){}}
function defKey(){return 'fmdef:'+(((DB&&DB.store)||(DEFAULT_DB&&DEFAULT_DB.store)||'store'));}
document.getElementById('rememberDefault').onclick=()=>{try{localStorage.setItem(defKey(),JSON.stringify(currentDB()));toast('現在の配置を「初期値」として記憶しました');}catch(e){toast('記憶に失敗しました');}};
document.getElementById('resetDefault').onclick=()=>{
 var base=null;try{var s=localStorage.getItem(defKey());if(s)base=JSON.parse(s);}catch(e){}
 var isHome=(((DB&&DB.store)||'')===((DEFAULT_DB&&DEFAULT_DB.store)||''));
 if(!base&&!isHome){toast('この店舗の「初期値記憶」がありません。先に基本配置を作って「初期値記憶」を押してください');return;}
 if(!confirm(base?'記憶した初期値に戻します。よろしいですか？':'初期配置に戻します。よろしいですか？'))return;
 try{localStorage.removeItem(lsKey());}catch(e){}
 loadDB(base||clone(DEFAULT_DB));saveLocal();toast(base?'記憶した初期値に戻しました':'初期配置に戻しました');};
(function init(){let saved=null;
 try{
  let lastStore=null;try{lastStore=localStorage.getItem('fm:last');}catch(e){}
  if(lastStore){const s=localStorage.getItem('fm:'+lastStore);if(s)saved=JSON.parse(s);}
  if(!saved){const s=localStorage.getItem('fm:'+((DEFAULT_DB&&DEFAULT_DB.store)||'store'));if(s)saved=JSON.parse(s);}
 }catch(e){}
 if(saved&&saved.machines&&saved.machines.length){loadDB(saved);setTimeout(()=>toast('前回の配置を復元しました（'+(saved.store||'店舗名未設定')+'）'),350);}
 else{loadDB(clone(DEFAULT_DB));}
})();
</script></body></html>
